version: '3.8'

services:
  # ============================================================================
  # FastAPI Gateway (Central)
  # ============================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ai-runtime-gateway
    ports:
      - "8000:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      LOG_LEVEL: INFO
      AUDIT_LOG_FILE: audit.log
    volumes:
      - ./gateway:/app
      - ./logs:/app/logs
    networks:
      - ai-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - content-moderation
      - finance-analysis
      - support-chatbot
    command: python app.py
    restart: unless-stopped
  
  # ============================================================================
  # Microservice 1: Content Moderation
  # ============================================================================
  content-moderation:
    build:
      context: ./services/content_moderation
      dockerfile: Dockerfile
    container_name: ai-runtime-content-mod
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: content-moderation
      SERVICE_PORT: 8001
      LOG_LEVEL: INFO
    volumes:
      - ./services/content_moderation:/app
    networks:
      - ai-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: python app_a_content.py
    restart: unless-stopped
  
  # ============================================================================
  # Microservice 2: Finance Analysis
  # ============================================================================
  finance-analysis:
    build:
      context: ./services/finance_analysis
      dockerfile: Dockerfile
    container_name: ai-runtime-finance
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: finance-analysis
      SERVICE_PORT: 8002
      LOG_LEVEL: INFO
    volumes:
      - ./services/finance_analysis:/app
    networks:
      - ai-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: python app_b_finance.py
    restart: unless-stopped
  
  # ============================================================================
  # Microservice 3: Support Chatbot
  # ============================================================================
  support-chatbot:
    build:
      context: ./services/support_chatbot
      dockerfile: Dockerfile
    container_name: ai-runtime-support
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: support-chatbot
      SERVICE_PORT: 8003
      LOG_LEVEL: INFO
    volumes:
      - ./services/support_chatbot:/app
    networks:
      - ai-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: python app_c_support.py
    restart: unless-stopped
  
  # ============================================================================
  # Streamlit Dashboard
  # ============================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ai-runtime-dashboard
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: true
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - ./dashboard:/app
    networks:
      - ai-runtime
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: streamlit run streamlit_app.py
    restart: unless-stopped

# ============================================================================
# Network
# ============================================================================

networks:
  ai-runtime:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================

volumes:
  logs:
    driver: local
